# nginx reverse proxy cho AgentBase Runtime.
# Port 8080 (platform route vào đây):
#   /health → FastAPI health
#   /api/   → FastAPI (uvicorn 8000)
#   /       → Next.js (3000)

server {
    listen 8080;
    server_name _;

    # Health check BẮT BUỘC của AgentBase: GET /health → 200.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # API backend → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Mọi path khác → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Next.js HMR / RSC streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
