# nginx reverse proxy cho AgentBase Runtime.
# Lắng nghe 8080 (platform route vào đây), đẩy traffic sang Streamlit ở 127.0.0.1:8501.

server {
    listen 8080;
    server_name _;

    # Health check BẮT BUỘC của AgentBase: GET /health → 200.
    # Map thẳng vào health endpoint nội bộ của Streamlit để trạng thái ACTIVE
    # phản ánh đúng việc app đã sẵn sàng hay chưa.
    location = /health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }

    # Mọi path khác → Streamlit (kèm nâng cấp WebSocket mà Streamlit cần).
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (Streamlit dùng WS cho live update)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
