<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance DataOps Console</title>
  <style>
    :root {
      /* neutral base — color carries meaning, not decoration */
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #fbfcfd;
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: #e6e9ee;
      --soft: #eef1f5;
      /* single accent */
      --accent: #2563eb;
      --accent-soft: #eff5ff;
      /* status — restrained, meaningful */
      --ok: #15803d;     --ok-soft: #ecfdf3;
      --warn: #b45309;   --warn-soft: #fff8eb;
      --bad: #be123c;    --bad-soft: #fef2f4;
      --neutral: #475569; --neutral-soft: #f1f5f9;
      --shadow: 0 1px 2px rgba(15,23,42,.05);
      --shadow-lg: 0 1px 2px rgba(15,23,42,.06), 0 16px 40px rgba(15,23,42,.06);
      --r: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .app { min-height: 100vh; display: grid; grid-template-columns: 244px 1fr; }

    /* ── Sidebar ── */
    .side { position: sticky; top: 0; height: 100vh; background: #0c1320; color: #cbd5e1;
            display: flex; flex-direction: column; overflow: hidden; }
    .brand { padding: 18px 18px 14px; display: flex; gap: 11px; align-items: center;
             border-bottom: 1px solid rgba(255,255,255,.07); }
    .brand .mk { width: 32px; height: 32px; border-radius: 8px;
                 background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff;
                 display: grid; place-items: center; font-weight: 800; font-size: 15px; }
    .brand h1 { margin: 0; font-size: 13.5px; color: #fff; line-height: 1.15; }
    .brand p { margin: 2px 0 0; font-size: 11px; color: #64748b; }
    .nav { padding: 10px 8px; display: grid; gap: 1px; overflow-y: auto; }
    .nav .sec { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
                color: #475569; padding: 12px 10px 5px; font-weight: 700; }
    .nav button { width: 100%; text-align: left; background: transparent; border: 0;
                  color: #94a3b8; padding: 8px 10px; border-radius: 7px; font-size: 13px;
                  font-weight: 550; display: flex; gap: 10px; align-items: center; }
    .nav button:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
    .nav button.active { background: rgba(37,99,235,.16); color: #fff; }
    .nav button.active svg { color: #60a5fa; }
    .nav svg { width: 16px; height: 16px; flex: 0 0 auto; color: #64748b; }
    .nav .pill { margin-left: auto; font-size: 10.5px; font-weight: 800; padding: 1px 7px;
                 border-radius: 999px; background: rgba(190,18,60,.22); color: #fda4af; }
    .nav .pill.amber { background: rgba(180,83,9,.22); color: #fcd34d; }
    .side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.07);
                 font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .side-foot .dot { width: 7px; height: 7px; border-radius: 999px; background: #22c55e; }

    /* ── Topbar ── */
    .main { min-width: 0; }
    .top { position: sticky; top: 0; z-index: 20; background: rgba(247,248,250,.82);
           backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
           padding: 11px 26px; display: flex; align-items: center; gap: 12px; }
    .search { flex: 0 1 460px; display: flex; align-items: center; gap: 8px; background: var(--panel);
              border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; color: var(--muted); }
    .search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
    .sel { border: 1px solid var(--line); background: var(--panel); border-radius: 9px;
           padding: 7px 10px; color: var(--ink-2); font-weight: 550; }
    .top .spacer { margin-left: auto; }
    .iconbtn { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--panel);
               border-radius: 9px; display: grid; place-items: center; position: relative; color: var(--muted); }
    .iconbtn .nb { position: absolute; top: -4px; right: -4px; background: var(--bad); color: #fff;
                   font-size: 10px; font-weight: 800; border-radius: 999px; padding: 0 5px; line-height: 16px; }
    .who { display: flex; align-items: center; gap: 9px; padding: 4px 6px 4px 4px; border: 1px solid var(--line);
           background: var(--panel); border-radius: 999px; }
    .who .av { width: 28px; height: 28px; border-radius: 999px; background: #1e293b; color: #fff;
               display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .who small { color: var(--muted); font-size: 12px; }

    /* ── Content layout ── */
    .content { padding: 24px 26px 56px; max-width: 1500px; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
    .head .crumb { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
    .head h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    .head p { margin: 6px 0 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
    .head .actions { display: flex; gap: 8px; flex: 0 0 auto; }

    .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
           border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 650; }
    .btn:hover { border-color: #cbd5e1; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--shadow); }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn.bad { background: #fff; border-color: #fecdd3; color: var(--bad); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }

    .grid { display: grid; gap: 16px; }
    .c4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .c2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .main-side { grid-template-columns: minmax(0,1.5fr) minmax(330px,.55fr); }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
    .ph { padding: 13px 16px; border-bottom: 1px solid var(--soft); display: flex;
          align-items: center; justify-content: space-between; gap: 10px; }
    .ph h3 { margin: 0; font-size: 13.5px; font-weight: 700; }
    .ph .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .ph .link { color: var(--accent); font-size: 12.5px; font-weight: 650; background: none; border: 0; }
    .pb { padding: 14px 16px; }
    .pb.flush { padding: 0; }

    /* metric */
    .metric { padding: 15px 16px; }
    .metric .k { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .metric .v { font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin-top: 6px; line-height: 1; }
    .metric .d { margin-top: 7px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .trend.up { color: var(--ok); } .trend.down { color: var(--bad); }

    /* badges */
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 3px 8px;
             font-size: 11.5px; font-weight: 700; white-space: nowrap; line-height: 1.4; }
    .badge .d { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
    .b-ok { color: var(--ok); background: var(--ok-soft); }
    .b-warn { color: var(--warn); background: var(--warn-soft); }
    .b-bad { color: var(--bad); background: var(--bad-soft); }
    .b-acc { color: var(--accent); background: var(--accent-soft); }
    .b-neu { color: var(--neutral); background: var(--neutral-soft); }

    /* worklist rows */
    .list { display: grid; }
    .item { padding: 13px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
            align-items: center; border-bottom: 1px solid var(--soft); cursor: pointer; }
    .item:last-child { border-bottom: 0; }
    .item:hover { background: var(--panel-2); }
    .item .lead { width: 4px; align-self: stretch; border-radius: 999px; background: var(--line); }
    .item.high .lead { background: var(--bad); }
    .item.med .lead { background: var(--warn); }
    .item .t { font-size: 13.5px; font-weight: 650; }
    .item .s { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .item .r { display: flex; gap: 7px; align-items: center; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
               text-align: left; font-weight: 700; padding: 11px 16px; border-bottom: 1px solid var(--soft); }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--soft); font-size: 13px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clk { cursor: pointer; }
    tbody tr.clk:hover td { background: var(--panel-2); }
    .mono { font-family: "SFMono-Regular", ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-2); }
    .cellsub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

    /* drawer */
    .drawer { position: sticky; top: 70px; align-self: start; }
    .empty { padding: 40px 22px; text-align: center; color: var(--muted); }
    .empty .ic { width: 40px; height: 40px; margin: 0 auto 12px; border-radius: 10px; background: var(--soft);
                 display: grid; place-items: center; color: var(--faint); }
    .empty p { margin: 0; line-height: 1.5; font-size: 13px; }

    /* key/value */
    .kv { display: grid; gap: 0; }
    .kv > div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0;
                border-bottom: 1px dashed var(--soft); font-size: 12.5px; }
    .kv > div:last-child { border-bottom: 0; }
    .kv .k { color: var(--muted); }
    .kv .v { font-weight: 650; text-align: right; }

    /* tabs */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .tabs button { border: 0; background: none; padding: 9px 11px; font-weight: 650; font-size: 13px;
                   color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button.active { color: var(--accent); border-color: var(--accent); }

    /* trace tree */
    .trace { display: grid; }
    .tstage { border-bottom: 1px solid var(--soft); }
    .tstage:last-child { border-bottom: 0; }
    .tstage-h { display: grid; grid-template-columns: 26px 1fr auto; gap: 11px; align-items: center;
                padding: 12px 0; }
    .tnode { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
             font-size: 11px; font-weight: 800; background: var(--neutral-soft); color: var(--neutral); }
    .tstage.ok .tnode { background: var(--ok-soft); color: var(--ok); }
    .tstage.warn .tnode { background: var(--warn-soft); color: var(--warn); }
    .tstage.bad .tnode { background: var(--bad-soft); color: var(--bad); }
    .tstage-h .nm { font-weight: 700; font-size: 13px; }
    .tstage-h .ds { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .tsub { padding: 0 0 12px 37px; display: grid; gap: 7px; }
    .tcall { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
             border: 1px solid var(--soft); border-radius: 8px; padding: 9px 11px; background: var(--panel-2); }
    .tcall .nm { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .tcall .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

    /* evidence cards */
    .evi { display: grid; gap: 8px; }
    .evcard { border: 1px solid var(--soft); border-radius: 9px; padding: 11px 12px; background: var(--panel-2); }
    .evcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .evcard .ty { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
    .evcard .bd { font-size: 12.5px; margin-top: 6px; line-height: 1.5; color: var(--ink-2); }

    /* diff */
    .diff { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .diff .ln { padding: 4px 12px; white-space: pre-wrap; }
    .diff .del { background: var(--bad-soft); color: #9f1239; }
    .diff .add { background: var(--ok-soft); color: #166534; }
    .diff .ctx { color: var(--muted); }

    /* canvas / flow */
    .flow { display: grid; grid-auto-flow: column; align-items: stretch; gap: 8px; overflow-x: auto;
            padding: 14px; background: var(--panel-2); border: 1px solid var(--soft); border-radius: var(--r); }
    .fnode { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px;
             min-width: 150px; box-shadow: var(--shadow); }
    .fnode b { font-size: 12.5px; display: block; }
    .fnode span { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.4; }
    .farr { align-self: center; color: var(--faint); font-weight: 800; }

    /* callout */
    .note { display: flex; gap: 10px; padding: 11px 13px; border-radius: 9px; font-size: 12.5px; line-height: 1.5; }
    .note.warn { background: var(--warn-soft); color: #92400e; }
    .note.acc { background: var(--accent-soft); color: #1e40af; }
    .note.bad { background: var(--bad-soft); color: #9f1239; }

    /* agent context block (not a chat panel) */
    .agent { border: 1px solid var(--accent-soft); background: linear-gradient(180deg,#fbfdff,#fff);
             border-radius: var(--r); }
    .agent .ah { padding: 11px 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--soft); }
    .agent .spark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
                    display: grid; place-items: center; }
    .agent .ah b { font-size: 13px; } .agent .ah small { color: var(--muted); margin-left: auto; font-size: 11.5px; }

    .meterbar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .meterbar > i { display: block; height: 100%; border-radius: 999px; }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 1fr; }
      .side { position: relative; height: auto; }
      .nav { grid-auto-flow: column; overflow-x: auto; }
      .nav .sec { display: none; }
      .c4,.c3,.c2,.main-side { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="mk">F</div>
        <div><h1>Finance DataOps</h1><p>Governed automation console</p></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><span class="dot"></span>Control plane · governed execution</div>
    </aside>

    <main class="main">
      <div class="top">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input placeholder="Search runs, automations, connectors, metrics…" />
        </label>
        <select class="sel"><option>Production</option><option>Staging</option></select>
        <select class="sel"><option>Last 24 hours</option><option>Last 7 days</option><option>Last 30 days</option></select>
        <span class="spacer"></span>
        <button class="iconbtn" title="Notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="nb">3</span></button>
        <div class="who"><span class="av">TD</span><div><div style="font-size:12.5px;font-weight:650">Trâm Đ.</div><small>Data Engineer</small></div></div>
      </div>
      <section class="content" id="view"></section>
    </main>
  </div>

  <script>
  /* ───────────────────────── DATA (grounded in the real project) ───────────────────────── */
  const NAV = [
    { sec: "Operate" },
    ["overview","Overview","M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"],
    ["automations","Automations","M4 7h4v4H4zM16 7h4v4h-4zM4 17h4v4H4zM8 9h4a4 4 0 0 1 4 4v3"],
    ["runs","Runs & Traces","M4 6h16M4 12h10M4 18h7"],
    { sec: "Decide", badgeFor: "approvals" },
    ["approvals","Approvals","M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z M9 12l2 2 4-5"],
    ["incidents","Incidents","M12 3 2 21h20zM12 9v5M12 18h.01"],
    { sec: "Govern" },
    ["integrations","Integrations","M9 7H7a5 5 0 0 0 0 10h2m6-10h2a5 5 0 0 1 0 10h-2M8 12h8"],
    ["catalog","Catalog","M5 4h13v16H6a2 2 0 0 1-1-2zM8 8h7M8 12h7"],
    ["governance","Governance","M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"],
  ];

  const KPI = [
    { k: "Active automations", v: "4", d: "1 paused", trend: "" },
    { k: "Runs today", v: "184", d: "96.1% success", trend: "up" },
    { k: "Pending approvals", v: "3", d: "all L2 assisted", trend: "" },
    { k: "Connector health", v: "4 / 5", d: "1 degraded", trend: "down" },
  ];

  const ATTENTION = [
    { sev:"high", t:"Approve revenue fix · net_revenue overstated 2.1%", s:"Verified evidence · gated L2 patch waiting for Finance", badge:["L2","12 min"], go:"incidents" },
    { sev:"high", t:"Investigate failed DAG · daily_orders_pipeline", s:"Schema drift — required column order_channel added upstream", badge:["high"], go:"incidents" },
    { sev:"med",  t:"Google Sheets connector degraded", s:"8.7% error rate over last 24h — OAuth scope check needed", badge:["degraded"], go:"integrations" },
    { sev:"med",  t:"Automation paused · Sheet reconciliation intake", s:"Auto-paused after 3 repeated auth failures — needs owner review", badge:["paused"], go:"automations" },
  ];

  const AUTOMATIONS = [
    { id:"auto_revenue_mismatch_triage", name:"Revenue mismatch triage", trig:"Finance alert / 04:15 schedule", apps:["Airflow","GitLab","Teams"], status:"active", risk:"L2", owner:"finance-data", success:"96%", last:"12 min ago" },
    { id:"auto_failed_dag_router",       name:"Failed DAG router",       trig:"Airflow task_failed", apps:["Airflow","Teams"], status:"active", risk:"L3", owner:"data-platform", success:"91%", last:"23 min ago" },
    { id:"auto_schema_change_review",    name:"Schema change review",    trig:"GitLab MR opened", apps:["GitLab","Catalog"], status:"active", risk:"L2", owner:"data-platform", success:"98%", last:"35 min ago" },
    { id:"auto_sheet_recon_intake",      name:"Sheet reconciliation intake", trig:"Google Sheet updated", apps:["Sheets","Email","GitLab"], status:"paused", risk:"L2", owner:"finance-ops", success:"88%", last:"2h ago" },
  ];

  const RUNS = [
    { id:"run_24891", auto:"Revenue mismatch triage", status:"waiting approval", dur:"42s", trig:"Finance alert", failed:"", tok:"18.2k", cost:"$0.11", at:"12 min ago" },
    { id:"run_24890", auto:"Failed DAG router",       status:"success",          dur:"18s", trig:"Airflow failure", failed:"", tok:"6.1k", cost:"$0.04", at:"23 min ago" },
    { id:"run_24889", auto:"Sheet reconciliation intake", status:"failed",       dur:"31s", trig:"Sheet update", failed:"Google Sheets MCP · credential missing", tok:"3.4k", cost:"$0.02", at:"2h ago" },
    { id:"run_24888", auto:"Schema change review",    status:"success",          dur:"54s", trig:"GitLab MR", failed:"", tok:"24.7k", cost:"$0.16", at:"3h ago" },
    { id:"run_24887", auto:"Failed DAG router",       status:"retry scheduled",  dur:"—",   trig:"Airflow failure", failed:"transient 429 · retry in 4m", tok:"2.0k", cost:"$0.01", at:"3h ago" },
  ];

  // trace for run_24891 — Planner → Executor → Verifier → Decision (LangGraph)
  const TRACE = [
    { st:"ok", node:"PLAN", name:"Planner", ds:"Classified intent=metric_mismatch · risk L2 · scope net_revenue 2026-06-07", dur:"1.8s", calls:[
        { ok:"ok", nm:"intent_classifier", meta:"model=small · intent=metric_mismatch · confidence 0.93", dur:"320ms" },
        { ok:"ok", nm:"context_retriever", meta:"hybrid RAG · runbook_revenue_mismatch + 2 prior incidents", dur:"540ms" },
        { ok:"ok", nm:"plan generated", meta:"4 steps: sql_profile · enum_drift · code_search · impact_simulation", dur:"940ms" },
    ]},
    { st:"ok", node:"EXEC", name:"Tool Executor", ds:"Governed registry · 4/4 tools succeeded · 0 raw rows to LLM", dur:"12.4s", calls:[
        { ok:"ok", nm:"sql_profile · revenue_daily", meta:"L1 read-only · mismatch 2.10% measured from SQL", dur:"3.1s" },
        { ok:"ok", nm:"enum_drift · refund_status", meta:"L1 · new value PARTIAL_REFUND (4.2% of rows)", dur:"2.0s" },
        { ok:"ok", nm:"code_search · revenue_daily.sql (GitLab MCP)", meta:"L1 · mapping subtracts only WHEN refund_status='REFUNDED'", dur:"4.6s" },
        { ok:"ok", nm:"impact_simulation", meta:"L1 · affected_amount 210,000,000 VND", dur:"2.7s" },
    ]},
    { st:"ok", node:"CHK", name:"Verifier / Critic", ds:"4 claims extracted · 4 verified by rule engine · 0 contradictions", dur:"4.9s", calls:[
        { ok:"ok", nm:"claim_verifier", meta:"3/3 numeric claims reconcile with measured values", dur:"3.2s" },
        { ok:"ok", nm:"contradiction_check", meta:"no conflict with prior incidents in memory", dur:"1.7s" },
    ]},
    { st:"warn", node:"DEC", name:"Decision Router", ds:"Patch is narrow & validated, but changes a revenue metric → gate for human approval", dur:"90ms", calls:[

  }

  function vGovernance(){
    const rows = POLICIES.map(p=>`<tr><td><strong>${p[0]}</strong></td><td>${p[1]==="Blocked"?badge("blocked","bad"):p[1]==="Allowed"?badge("allowed","ok"):p[1]==="Auto with audit"?badge(p[1],"ok"):badge(p[1],"warn")}</td><td>${p[2]}</td></tr>`).join("");
    const audit = `<div class="kv">
      <div><span class="k">Raw rows to LLM</span><span class="v">${badge("blocked","bad")}</span></div>
      <div><span class="k">Production deploy</span><span class="v">${badge("blocked","bad")}</span></div>
      <div><span class="k">External write</span><span class="v">${badge("approval","warn")}</span></div>
      <div><span class="k">MCP tool access</span><span class="v">allow-list only</span></div>
      <div><span class="k">Memory write-back</span><span class="v">after validated + approved</span></div></div>`;
    return head("Govern / Governance","Governance",
      "What agents may read, draft, retry, notify or block. Every tool call and approval is auditable.",
      `<button class="btn primary">Create policy</button>`)
      + `<div class="grid main-side">${panel("Permission tiers","Execution policy — L1/L2/L3",flush(`<table><thead><tr><th>Tier</th><th>Default decision</th><th>Examples</th></tr></thead><tbody>${rows}</tbody></table>`))}
          ${panel("Audit posture","Current hard controls",audit)}</div>`;
  }

  const VIEWS = { overview:vOverview, automations:vAutomations, runs:vRuns, approvals:vApprovals,
                  incidents:vIncidents, integrations:vIntegrations, catalog:vCatalog, governance:vGovernance };

  function render(){ renderNav(); document.getElementById("view").innerHTML = VIEWS[state.view](); }
  window.go = k => { state.view=k; if(k==="incidents") state.tab=0; render(); window.scrollTo(0,0); };
  window.selRun = i => { state.run=RUNS[i]; render(); };
  window.selAppr = i => { state.appr=APPROVALS[i]; render(); };
  window.selInc = i => { state.inc=INCIDENTS[i]; state.tab=1; render(); };
  render();
  </script>
</body>
</html>
