const TONE={emerald:"text-emerald-700 bg-emerald-50 ring-emerald-600/20 dark:text-emerald-400 dark:bg-emerald-500/10",rose:"text-rose-700 bg-rose-50 ring-rose-600/20 dark:text-rose-400 dark:bg-rose-500/10",amber:"text-amber-700 bg-amber-50 ring-amber-600/20 dark:text-amber-400 dark:bg-amber-500/10",indigo:"text-indigo-700 bg-indigo-50 ring-indigo-600/20 dark:text-indigo-400 dark:bg-indigo-500/10",slate:"text-slate-600 bg-slate-100 ring-slate-500/20 dark:text-slate-300 dark:bg-slate-700/40"};

/* ───── mini charts (inline SVG) ───── */
function Spark({data,w=130,h=34,color="#6366f1"}){if(!data||!data.length)return null;const max=Math.max(...data),min=Math.min(...data),rng=(max-min)||1;const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/rng)*(h-4)-2}`).join(" ");return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>;}
function HBars({items,fmt}){const max=Math.max(...items.map(i=>i.value),1);return <div className="space-y-2">{items.map((it,k)=><button key={k} onClick={it.onClick} className="w-full text-left block"><div className="flex justify-between text-[11.5px] mb-0.5"><span className="text-slate-500 dark:text-slate-400">{it.label}</span><span className="text-slate-400">{fmt?fmt(it):it.value}</span></div><div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800"><div className="h-full rounded-full" style={{width:`${(it.value/max)*100}%`,background:it.color||"#6366f1"}}/></div></button>)}</div>;}
function HourStack({buckets,h=96}){const keys=[["success","#10b981"],["failed","#f43f5e"],["retry","#f59e0b"],["running","#6366f1"]];const max=Math.max(...buckets.map(b=>keys.reduce((s,[k])=>s+(b[k]||0),0)),1);const bw=100/buckets.length;return <div><svg viewBox={`0 0 100 ${h}`} className="w-full" style={{height:h}} preserveAspectRatio="none">{buckets.map((b,i)=>{let y=h;const x=i*bw+bw*0.18,w=bw*0.64;return <g key={i}>{keys.map(([k,c])=>{const val=b[k]||0,hh=(val/max)*(h-2);if(!val)return null;y-=hh;return <rect key={k} x={x} y={y} width={w} height={hh} fill={c} rx="0.5"/>;})}</g>;})}</svg><div className="flex justify-between text-[9px] text-slate-400 mt-1">{buckets.map((b,i)=><span key={i}>{b.h}</span>)}</div></div>;}
function Donut({segs,size=92}){const total=segs.reduce((s,x)=>s+x.value,0)||1;let acc=0;const r=size/2-9,cx=size/2,cy=size/2,circ=2*Math.PI*r;return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>{segs.map((s,i)=>{const frac=s.value/total,dash=`${frac*circ} ${circ}`,off=-acc*circ;acc+=frac;return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="9" strokeDasharray={dash} strokeDashoffset={off} transform={`rotate(-90 ${cx} ${cy})`}/>;})}<text x={cx} y={cy+5} textAnchor="middle" fontSize="15" fontWeight="800" fill="#64748b">{total}</text></svg>;}
function Gauge({pct,size=128}){const r=size/2-12,cx=size/2,cy=size/2,a=Math.PI*(1-pct/100),x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);const color=pct>=95?"#10b981":pct>=85?"#f59e0b":"#f43f5e";return <svg width={size} height={size/2+12} viewBox={`0 0 ${size} ${size/2+12}`}><path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke="#e2e8f0" strokeWidth="10"/><path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${x} ${y}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/><text x={cx} y={cy-4} textAnchor="middle" fontSize="22" fontWeight="800" fill="#334155">{pct}%</text></svg>;}
function Heat({rows}){const c={ok:"#10b981",warn:"#f59e0b",bad:"#f43f5e"};return <div className="space-y-1.5">{rows.map(r=><div key={r.name} className="flex items-center gap-2"><span className="font-mono text-[11px] w-44 truncate text-slate-500 dark:text-slate-400">{r.name}</span><div className="flex gap-1">{r.cells.map((v,i)=><span key={i} className="w-4 h-4 rounded" style={{background:c[v]}} title={v}/>)}</div></div>)}</div>;}

function buildAnswer(q,ctx,mode){const low=(q||"").toLowerCase();
 if(mode==="Debug"||low.includes("fail")||low.includes("why")||(ctx&&(ctx.type==="task"||ctx.type==="dag"||ctx.type==="issue"))){
  const cause=(ctx&&ctx.cause)||"data/schema issue";

  return{summary:`${ctx?ctx.id:"Object"} failed — classified as **${klass}**.`,evidence:[cause,"see highlighted logs below"],impact:["net_revenue","finance_revenue_report"],confidence:"High",links:["log://"+(ctx&&(ctx.dag||ctx.id)),"dag://"+(ctx&&(ctx.dag||ctx.id))],next:[klass.includes("transient")?"Auto-retry with backoff (L3)":"Review the Proposed Fix → create a PR draft (L2/L3)","Run validation before merge"],fix:(klass.includes("enum")||klass==="data issue")?FIXES.map_refund:null};
 }
 if(low.includes("calcul")||low.includes("how")||low.includes("from")||low.includes("metric")||low.includes("revenue")||mode==="Explain"){
  const m=METRICS.net_revenue;return{summary:`**${m.name}**: ${m.def}.`,evidence:[`Formula: ${m.formula}`,`Sources: ${m.tables.join(", ")}`,`DAG: ${m.dag}`],impact:m.dashboards,confidence:"High",links:["table://payment_txn","dag://"+m.dag,"dashboard://finance_revenue_report"],next:["Open lineage","Check payment_txn freshness"],sql:m.sql};
 }
 if(mode==="Impact"||mode==="What-if"||low.includes("impact")||low.includes("change")||low.includes("if i")){
  const a=(ctx&&ctx.id)||"stg_payment";return{summary:`Changing **${a}** would impact downstream:`,evidence:["based on lineage graph"],impact:["revenue_daily","net_revenue","finance_revenue_report","Finance"],confidence:"Medium",links:["lineage://"+a],next:["Run reconciliation after the change","Notify Finance Owner (SLA 04:00)"]};
 }

 return{summary:"I need more context (pick an object in the sidebar/page or name it explicitly). I won't guess when metadata is missing.",evidence:[],impact:[],confidence:"Low",links:[],next:[]};
}

const INTRO={role:"ai",a:{summary:"DataOps AI — pick an object or ask about lineage, failures, impact, or SQL.",confidence:"High",next:[]}};
function App(){const[mod,setMod]=useState("health");const[detail,setDetail]=useState(null);const[ctx,setCtx]=useState(null);const[dark,setDark]=useState(false);const[perm,setPerm]=useState(2);

 const[messages,setMessages]=useState(()=>{try{const s=sessionStorage.getItem("dataops_chat_v2");return s?JSON.parse(s):[INTRO];}catch(e){return [INTRO];}});
 useEffect(()=>{try{sessionStorage.setItem("dataops_chat_v2",JSON.stringify(messages));}catch(e){}},[messages]);
 useEffect(()=>{document.documentElement.classList.toggle("dark",dark);document.body.className=dark?"bg-slate-950":"bg-slate-100";},[dark]);
 const go=(m)=>{setMod(m);setDetail(null);setCtx(null);};
 const open=(type,id)=>{setDetail({type,id});if(typeof id==="string")setCtx({type,id});window.scrollTo&&window.scrollTo(0,0);};
 const askInternal=(text,m)=>{const a=buildAnswer(text,ctx,m||mode);setMessages(p=>[...p,{role:"user",text},{role:"ai",a}]);};
 const ai=(context,seedQ)=>{if(context)setCtx(context);setAiOpen(true);if(seedQ){const a=buildAnswer(seedQ,context||ctx,mode);setMessages(p=>[...p,{role:"user",text:seedQ},{role:"ai",a}]);}};
 const clear=()=>setMessages([INTRO]);
 let body;
 if(detail){const{type,id}=detail;const crumbBase=[{label:MOD_TITLE[mod],go:()=>{setDetail(null);setCtx(null);}}];
  if(type==="dag")body=<><Crumb items={[...crumbBase,{label:id}]}/><DagDetail id={id} open={open} ai={ai}/></>;
  else if(type==="task")body=<><Crumb items={[{label:"DAG Operations",go:()=>go("dag")},{label:id.dag,go:()=>open("dag",id.dag)},{label:id.id}]}/><TaskDetail task={id} ai={ai} perm={perm}/></>;
  else if(type==="issue")body=<><Crumb items={[...crumbBase,{label:ISSUES[id]?ISSUES[id].title:id}]}/><IssueDetail id={id} open={open} ai={ai}/></>;
  else if(type==="table")body=<><Crumb items={[...crumbBase,{label:id}]}/><TableDetail id={id} open={open} ai={ai}/></>;
  else if(type==="metric")body=<><Crumb items={[...crumbBase,{label:id}]}/><MetricDetail id={id} ai={ai}/></>;
  else if(type==="project")body=<><Crumb items={[...crumbBase,{label:PROJECTS[id]?PROJECTS[id].name:id}]}/><ProjectDoc id={id} open={open}/></>;
 } else {
  body={health:<Overview open={open} ai={ai} go={go}/>,dag:<DagList open={open} ai={ai}/>,dq:<IssueList open={open} ai={ai}/>,catalog:<CatalogList open={open}/>,lineage:<LineageModule open={open}/>,sql:<SqlModule ai={ai} perm={perm}/>}[mod];
 }
 return <div className="flex min-h-screen text-slate-900 dark:text-slate-100">
  <Sidebar mod={mod} go={go} dark={dark} setDark={setDark}/>
  <div className="flex-1 min-w-0 flex flex-col">
   <Topbar perm={perm} setPerm={setPerm}/>
   <main className="flex-1 px-6 py-5 overflow-x-hidden"><div className="mb-4"><h1 className="text-lg font-extrabold text-slate-900 dark:text-white">{detail?detail.type[0].toUpperCase()+detail.type.slice(1)+" detail":MOD_TITLE[mod]}</h1></div>{body}</main>
  </div>
  {/* Floating AI */}
  <div className="fixed bottom-6 right-6 z-40 group">
   {!aiOpen&&<span className="absolute right-16 bottom-3.5 whitespace-nowrap bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded-lg shadow opacity-0 group-hover:opacity-100 transition pointer-events-none">Ask DataOps AI</span>}
   <button onClick={()=>setAiOpen(o=>!o)} className="w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-xl shadow-indigo-600/30 grid place-items-center transition-transform hover:scale-105"><Icon name={aiOpen?"x":"bot"} className="w-6 h-6"/></button>
  </div>
  <AIPanel open={aiOpen} onClose={()=>setAiOpen(false)} ctx={ctx} messages={messages} onAsk={askInternal} onClear={clear} perm={perm} mode={mode} setMode={setMode}/>
 </div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
